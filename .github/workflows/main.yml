name: Continues testing

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KBUILD_BUILD_USER: NATO66613
      KBUILD_BUILD_HOST: KREMLIN

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          create-symlink: true
          key: kernel-build-cache
          restore-keys: |
            kernel-build-cache
          max-size: '10G'

      - name: Restore Clang cache
        id: restore-clang
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/r547379
          key: clang-r547379

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex libelf-dev libncurses-dev libssl-dev unzip zip wget libarchive-tools
          ccache --show-stats

      - name: Deploy Clang
        if: steps.restore-clang.outputs.cache-hit != 'true'
        run: |
          git clone https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r547379.git /home/runner/r547379 --depth=1

      - name: Save Clang
        if: steps.restore-clang.outputs.cache-hit != 'true'
        id: cache-clang-save
        uses: actions/cache/save@v4
        with:
          path: /home/runner/r547379
          key: clang-r547379

      - name: Build the kernel with `ccache` (Unsigned, O=out, Modules enabled)
        run: |
          export CLANG_PATH=$HOME/r547379/bin
          export PATH=${CLANG_PATH}:${PATH}

          # Clean output directory
          make O=out mrproper

          # Apply device defconfig
          make O=out raphael_defconfig

          # Enable module support
          scripts/config --file out/.config --enable MODULES

          # Disable all module signature verification
          scripts/config --file out/.config --disable MODULE_SIG
          scripts/config --file out/.config --disable MODULE_SIG_ALL
          scripts/config --file out/.config --disable MODULE_SIG_FORCE

          # Save updated config
          make O=out olddefconfig

          # Re-check the config
          grep CONFIG_MODULES out/.config || true
          grep CONFIG_MODULE_SIG out/.config || true
          grep CONFIG_MODULE_SIG_ALL out/.config || true
          grep CONFIG_MODULE_SIG_FORCE out/.config || true

          # Compile the kernel
          make O=out LLVM=1 LLVM_IAS=1 CC="ccache clang" -j$(nproc)

          # Show ccache stats
          ccache --show-stats
          ccache --show-config
        shell: bash

      - name: Repack Kernel Artifacts
        run: |
          git clone --depth=1 https://github.com/SOVIET-ANDROID/AnyKernel3.git $HOME/AnyKernel3
          
          # Copy kernel images
          cp out/arch/arm64/boot/Image.gz-dtb $HOME/AnyKernel3/
          cp out/arch/arm64/boot/dtbo.img $HOME/AnyKernel3/

          # Generate dynamic ZIP name
          BRANCH=$(echo "${GITHUB_REF#refs/heads/}" | sed 's|/|-|g')
          COMMIT_HASH=$(echo "$GITHUB_SHA" | cut -c1-6)
          ZIP_NAME="${BRANCH}-${COMMIT_HASH}.zip"
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV

          # Move AnyKernel3 to workspace
          mv "$HOME/AnyKernel3" "$GITHUB_WORKSPACE/AnyKernel3"

          # Verify contents
          ls -lah $GITHUB_WORKSPACE/AnyKernel3
        shell: bash

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ github.workspace }}/AnyKernel3/
